[package]
name = "fast-codec"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fast-codec-codec = { path = "../codec" }
# The software renderer skips GPU context creation, which dominates cold start.
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18"] }

[build-dependencies]
slint-build = "1.18"

# Unifies with Slint's fontique so fontconfig is loaded at runtime and Linux
# builds need no libfontconfig-dev. Keep the version in step with Slint's.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", default-features = false, features = ["fontconfig-dlopen"] }
